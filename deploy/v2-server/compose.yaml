name: pillxai-v2
x-api: &api
  image: ${V2_IMAGE:?Verified API image required}
  pull_policy: never
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 128
  environment:
    PILLXAI_DATABASE_URL_FILE: /run/secrets/database-url
    PILLXAI_ROOT_PATH: ${V2_ROOT_PATH:-/dispenser-v2}
    PILLXAI_ENABLE_CONTRACT_PROBE: 'false'
    PILLXAI_LOGIN_LIMIT_PER_MINUTE: '60'
    V2_FORWARDED_ALLOW_IPS: ${V2_FORWARDED_ALLOW_IPS:-127.0.0.1}
  volumes:
    - type: bind
      source: ${V2_SHARED:?}/database-url
      target: /run/secrets/database-url
      read_only: true
      bind: {create_host_path: false}
  networks: [backend]
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  api:
    <<: *api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${V2_PORT:-8068}:8000"
    depends_on:
      db: {condition: service_healthy}
  migrate:
    <<: *api
    profiles: [operations]
    command: [alembic, -c, /app/apps/api/alembic.ini, upgrade, head]
    healthcheck: {disable: true}
  db:
    image: ${V2_POSTGRES_IMAGE:?Verified PostgreSQL image required}
    pull_policy: never
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - type: bind
        source: ${V2_SHARED}/postgres
        target: /var/lib/postgresql
        bind: {create_host_path: false}
      - type: bind
        source: ${V2_SHARED}/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${V2_SHARED}/app-password
        target: /run/secrets/app-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./init-db.sh
        target: /docker-entrypoint-initdb.d/init-db.sh
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *logging
  backup:
    image: ${V2_POSTGRES_IMAGE}
    pull_policy: never
    restart: unless-stopped
    user: "${V2_UID:?}:${V2_GID:?}"
    entrypoint: [sh, /operations/backup-loop.sh]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - type: bind
        source: ${V2_BACKUPS:?}
        target: /backups
        bind: {create_host_path: false}
      - type: bind
        source: ${V2_SHARED}/app-password
        target: /run/secrets/app-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./backup-loop.sh
        target: /operations/backup-loop.sh
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, 'test -f /backups/last-success && test $$(($$(date +%s) - $$(cat /backups/last-success))) -lt 90000']
      interval: 5m
      timeout: 5s
      start_period: 5m
      retries: 1
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    logging: *logging
networks:
  backend:
    internal: true
