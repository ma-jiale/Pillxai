[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pillxai-api"
version = "0.1.0"
description = "Pillxai central service; no device transport dependencies"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "pydantic==2.13.4",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
