name: pillxai_client
description: Pillxai Flutter client with prescription and account management.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_svg: 2.3.0
  http: ^1.6.0
  file_selector: 1.1.0
  pillxai_api_client:
    path: ../../packages/api_client
  pillxai_device_runtime:
    path: ../../packages/device_runtime
  pillxai_execution_core:
    path: ../../packages/execution_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/avatars/
    - assets/images/medicine-a.png
    - assets/images/medicine-b.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
