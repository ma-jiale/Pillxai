name: V2 Server CI and CD
on:
  push:
    # Every main update, including docs/client changes, validates and publishes its revision.
    branches: [main, NT, codex/v2-server-deployment]
  pull_request:
    paths: ['apps/api/**', 'deploy/v2-server/**', 'contracts/http/**', 'packages/api_client/**', 'tests/fixtures/**', '.github/workflows/v2-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pillxai_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PILLXAI_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/pillxai_v2_test
      PILLXAI_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/pillxai_v2_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: |
          python -m pip install -r apps/api/requirements.lock
          python -m pip install --no-deps -e apps/api
          python -m pip check
          ruff check --config apps/api/pyproject.toml apps/api deploy/v2-server
          python -m unittest discover -s deploy/v2-server/tests -v
          alembic -c apps/api/alembic.ini upgrade head
          python -m pytest apps/api/tests -q --junitxml=test-results.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('test-results.xml'); assert sum(int(s.get('skipped','0')) for s in r.iter('testsuite')) == 0, 'Integration tests were skipped'"
          python apps/api/tools/export_openapi.py
          git diff --exit-code -- contracts/http/openapi.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: v2-tests-${{ github.sha }}
          path: test-results.xml
  package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Build and test images against an isolated database
        env:
          REVISION: ${{ github.sha }}
        run: python deploy/v2-server/build_image.py --revision "$REVISION" --output "$RUNNER_TEMP/v2-artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v2-server-${{ github.sha }}
          path: ${{ runner.temp }}/v2-artifact/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: package
    # Only main pushes deploy; PRs, development branches and manual checks never deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2_CD_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, pillxa-server]
    environment: v2-production
    concurrency:
      group: v2-server-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: v2-server-${{ github.sha }}
          path: ${{ runner.temp }}/v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify, back up, migrate and deploy V2 only
        env:
          GH_TOKEN: ${{ github.token }}
          V2_SERVER_PYTHON: ${{ vars.V2_SERVER_PYTHON || '/home/deploy/miniforge3/bin/python3' }}
          ARTIFACT: ${{ runner.temp }}/v2-${{ github.run_id }}-${{ github.run_attempt }}
          REVISION: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          "$V2_SERVER_PYTHON" "$ARTIFACT/preflight.py"
          if [ ! -e "$HOME/projects/pillxa-dispenser/v2" ]; then
            "$V2_SERVER_PYTHON" "$ARTIFACT/manage.py" init
          fi
          "$V2_SERVER_PYTHON" "$ARTIFACT/manage.py" deploy \
            --artifact "$ARTIFACT" --revision "$REVISION" \
            --repository "$GITHUB_REPOSITORY" --branch "$BRANCH"
          "$V2_SERVER_PYTHON" "$ARTIFACT/preflight.py"
