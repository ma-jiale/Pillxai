name: Android Client Release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Display version, for example 0.2.0
        required: true
      version_code:
        description: Strictly increasing Android build number
        required: true
      api_url:
        description: Deployment HTTPS API base URL (including path prefix)
        required: true
      notes_file:
        description: Repository-relative UTF-8 release notes file
        required: true
permissions:
  contents: read
concurrency:
  group: android-client-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: android-client-release
    timeout-minutes: 40
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      API_URL: ${{ inputs.api_url }}
      NOTES_FILE: ${{ inputs.notes_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Validate inputs and prepare the pinned Flutter toolchain
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          from urllib.parse import urlparse
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['VERSION_NAME']), 'Stable versions only'
          assert 1 <= int(os.environ['VERSION_CODE']) <= 2100000000
          url = urlparse(os.environ['API_URL'])
          assert url.scheme == 'https' and url.hostname and url.username is None and url.password is None and not url.query and not url.fragment
          notes = pathlib.Path(os.environ['NOTES_FILE']).resolve()
          assert notes.is_relative_to(pathlib.Path.cwd()) and notes.is_file()
          PY
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.tools/pub-cache" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.tools/gradle" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$GITHUB_WORKSPACE/.tools/android-user" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          git init .tools/flutter
          git -C .tools/flutter remote add origin https://github.com/flutter/flutter.git
          # Flutter derives its SDK version from Git tags, even for a pinned commit.
          git -C .tools/flutter fetch --depth 1 origin refs/tags/3.47.1:refs/tags/3.47.1
          test "$(git -C .tools/flutter rev-parse '3.47.1^{commit}')" = 6655482ec06e547f90abf8ae7590466f4415978d
          git -C .tools/flutter checkout --detach 6655482ec06e547f90abf8ae7590466f4415978d
          python -m pip install -r apps/api/requirements.lock
          python -m unittest discover -s deploy/android-client/tests -v
      - name: Verify client and execution runtime
        shell: bash
        run: |
          FLUTTER="$GITHUB_WORKSPACE/.tools/flutter/bin/flutter"
          DART="$GITHUB_WORKSPACE/.tools/flutter/bin/dart"
          cd apps/client
          "$FLUTTER" pub get --enforce-lockfile
          "$FLUTTER" analyze --no-pub
          "$FLUTTER" test --no-pub test/app_update_test.dart test/business_ui_test.dart test/box_recognition_test.dart test/terminal_ui_test.dart
          cd ../../packages/device_runtime
          "$DART" pub get --enforce-lockfile
          "$DART" test
      - name: Build and verify a signed universal APK
        id: package
        shell: bash
        env:
          SIGNING_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
          PILLXAI_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          PILLXAI_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          PILLXAI_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          mkdir -p .tools/signing
          export PILLXAI_SIGNING_STORE="$GITHUB_WORKSPACE/.tools/signing/client.jks"
          trap 'rm -f "$PILLXAI_SIGNING_STORE"' EXIT
          test -n "$SIGNING_BASE64"
          test -n "$SIGNING_CERT_SHA256"
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$PILLXAI_SIGNING_STORE"
          # Check the configured keystore before spending time on the Android build.
          python - <<'PY'
          import os, re, subprocess
          certificate = subprocess.run([
              os.environ['JAVA_HOME'] + '/bin/keytool', '-J-Duser.language=en',
              '-list', '-v', '-keystore', os.environ['PILLXAI_SIGNING_STORE'],
              '-alias', os.environ['PILLXAI_SIGNING_KEY_ALIAS'],
              '-storepass:env', 'PILLXAI_SIGNING_STORE_PASSWORD',
          ], check=True, capture_output=True, text=True).stdout
          actual = re.search(r'SHA256: ([0-9A-Fa-f:]+)', certificate)
          actual = actual[1].replace(':', '').lower() if actual else None
          expected = os.environ['SIGNING_CERT_SHA256'].lower()
          print('Keystore certificate SHA-256:', actual)
          print('Expected certificate SHA-256:', expected)
          assert actual == expected, 'CI keystore does not match the production certificate'
          PY
          cd apps/client
          ../../.tools/flutter/bin/flutter build apk --release --no-pub \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --dart-define="PILLXAI_API_URL=$API_URL"
          cd ../..
          # Match the locally verified stable verifier; never select an installed preview.
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs apps/client/build/app/outputs/flutter-apk/app-release.apk
          python scripts/publish-client-release.py \
            --apk apps/client/build/app/outputs/flutter-apk/app-release.apk \
            --output release/android --notes "$NOTES_FILE" \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner" \
            --expected-certificate-sha256 "$SIGNING_CERT_SHA256"
          git rev-parse HEAD > release/android/source-revision.txt
          cp deploy/android-client/publish_to_server.py release/android/publish_to_server.py
          echo "manifest_sha256=$(sha256sum release/android/current.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-client-${{ inputs.version_code }}
          path: release/android/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, pillxa-server]
    environment: v2-production
    concurrency:
      group: v2-server-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-client-${{ inputs.version_code }}
          path: ${{ runner.temp }}/android-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish OTA and verify the public manifest and complete APK download
        env:
          V2_SERVER_PYTHON: ${{ vars.V2_SERVER_PYTHON || '/home/deploy/miniforge3/bin/python3' }}
          ARTIFACT: ${{ runner.temp }}/android-${{ github.run_id }}-${{ github.run_attempt }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          REVISION: ${{ github.sha }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          API_URL: ${{ inputs.api_url }}
        run: |
          "$V2_SERVER_PYTHON" "$ARTIFACT/publish_to_server.py" \
            --artifact "$ARTIFACT" \
            --output "$HOME/projects/pillxa-dispenser/v2/shared/client-releases" \
            --manifest-sha256 "$MANIFEST_SHA256" --revision "$REVISION" \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --api-url "$API_URL"
